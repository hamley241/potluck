# Personal machines: full setup, all three models, interactive.
profile = "personal"
interactive = true
debate_enabled = true
# Flip on after checking with security: paths whose diffs skip external review.
human_only_paths = []

[timeouts]
# model_call_seconds inherits the code default (300, the per-doer-call default;
# heavy generative doer steps get 600 -- implement 1200, ruling 002 R3 -- from
# the built-in step-adaptive map, hardening Step-0 §1.1). `round_seconds`
# removed (dead key: Timeouts has no such field, so it was silently dropped —
# §7 config hygiene).
gate_seconds = 300
feature_seconds = 72150  # = outer_min (C_max 2405 × N_max 30), §1.3 conservative backstop

[debate]
max_rounds = 2
use_tiebreaker = true

[escalation]
retries_before_counting = 0  # one attempt per bounded call (ruling 002 R3)
timeout_count_threshold = 3
consecutive_same_step_threshold = 2
